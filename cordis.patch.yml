# dsh-tier-router profile bundle: this host row only synchronizes the packaged
# `tiered` preset into ~/.dsh/.agent-presets, the discovery root scanned by
# @deepseek-ai/dsh-agent-presets. The routed tools/commands remain agent-plane
# and are mounted only when a session selects `tiered`.
- insert:
    - id: tier-preset-discovery
      name: dsh-tier-router
      config:
        hostPresetSync: true
